name: Rebuild v3 research evidence (no competition upload)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-lock.txt
      - run: bash scripts/download_competition_data.sh
      - run: .venv/bin/python scripts/prepare_data.py
      - run: .venv/bin/python scripts/build_features_v3.py
      - run: .venv/bin/python scripts/run_mine_v3.py
      - run: .venv/bin/python scripts/run_validation_v3.py
      - run: .venv/bin/python scripts/make_map.py && .venv/bin/python scripts/build_site.py
      - run: .venv/bin/python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: v3-research-only-geotiff-and-evidence
          path: |
            docs/downloads/*.tif
            docs/downloads/*.zip
            docs/downloads/submission-audit.json
            knowledge/hypotheses-v3-*.json
            knowledge/mine-results-v3.json
            knowledge/validation-v3.json
            knowledge/slot-gate.json
            knowledge/submission-manifest.json
